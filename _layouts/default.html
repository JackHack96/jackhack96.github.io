<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author }}">

  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

  <!-- Bootstrap Core CSS -->
  <link href="{{ '/vendor/bootstrap/css/bootstrap.min.css' | relative_url }}" rel="stylesheet">

  <!-- Custom Fonts -->
  <link href="{{ '/vendor/fontawesome-free/css/all.min.css' | relative_url }}" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,700,300italic,400italic,700italic"
    rel="stylesheet" type="text/css">
  <link href="{{ '/vendor/simple-line-icons/css/simple-line-icons.css' | relative_url }}" rel="stylesheet">

  <!-- Custom CSS -->
  <link href="{{ '/css/stylish-portfolio.min.css' | relative_url }}" rel="stylesheet">
  <link href="{{ '/css/timeline.css' | relative_url }}" rel="stylesheet">
  <link href="{{ '/css/blog.css' | relative_url }}" rel="stylesheet">

  {% feed_meta %}

</head>

<body id="page-top">

  <!-- Navigation -->
  <a class="menu-toggle rounded" href="#">
    <i class="fas fa-bars"></i>
  </a>
  <nav id="sidebar-wrapper">
    <ul class="sidebar-nav">
      <li class="sidebar-brand">
        <a href="{{ '/' | relative_url }}">Matteo Iervasi</a>
      </li>
      <li class="sidebar-nav-item">
        <a class="js-scroll-trigger" href="{{ '/' | relative_url }}#page-top">Contact</a>
      </li>
      <li class="sidebar-nav-item">
        <a class="js-scroll-trigger" href="{{ '/' | relative_url }}#about">About</a>
      </li>
      <li class="sidebar-nav-item">
        <a class="js-scroll-trigger" href="{{ '/' | relative_url }}#education">Educational and career</a>
      </li>
      <li class="sidebar-nav-item">
        <a class="js-scroll-trigger" href="{{ '/' | relative_url }}#publications">Publications</a>
      </li>
      <li class="sidebar-nav-item">
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
      </li>
    </ul>
  </nav>

  {{ content }}

  <!-- Footer -->
  <footer class="footer text-center" id="contact">
    <div class="container">
      <p class="text-muted small mb-0">Copyright &copy;
        <script>document.write(new Date().getFullYear())</script> Matteo Iervasi All Rights Reserved
      </p>
    </div>
  </footer>

  <!-- Scroll to Top Button-->
  <a class="scroll-to-top rounded js-scroll-trigger" href="#page-top">
    <i class="fas fa-angle-up"></i>
  </a>

  <!-- Bootstrap core JavaScript -->
  <script src="{{ '/vendor/jquery/jquery.min.js' | relative_url }}"></script>
  <script src="{{ '/vendor/bootstrap/js/bootstrap.bundle.min.js' | relative_url }}"></script>

  <!-- Plugin JavaScript -->
  <script src="{{ '/vendor/jquery-easing/jquery.easing.min.js' | relative_url }}"></script>

  <!-- Custom scripts for this template -->
  <script src="{{ '/js/stylish-portfolio.min.js' | relative_url }}"></script>

</body>

</html>
